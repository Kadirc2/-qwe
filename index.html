<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bambu Smart Living | Mağaza Portalı</title>
    <style>
        :root { 
            --bamboo-green: #4f7942; 
            --sand: #f4ece1; 
            --dark: #2c3e50;
            --white: #ffffff;
        }
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--sand); 
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container { 
            width: 90%; max-width: 400px; background: var(--white); padding: 30px; border-radius: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center;
        }
        .logo { font-size: 24px; font-weight: 800; color: var(--bamboo-green); margin-bottom: 5px; letter-spacing: 1px; }
        .tagline { font-size: 14px; color: #777; margin-bottom: 30px; }
        
        .nav-link {
            display: flex; align-items: center; justify-content: center;
            background: var(--white); border: 2px solid #eee; padding: 15px; margin-bottom: 15px;
            border-radius: 15px; text-decoration: none; color: var(--dark); font-weight: 600;
            transition: all 0.3s ease;
        }
        .nav-link:hover { border-color: var(--bamboo-green); color: var(--bamboo-green); transform: translateY(-2px); }
        .nav-link i { margin-right: 10px; font-size: 20px; }

        .footer { margin-top: 30px; font-size: 12px; color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">BAMBU SMART HOME</div>
        <div class="tagline">Doğallık ve Teknolojinin Buluşma Noktası</div>

        <a href="#bakim" class="nav-link">📖 Kullanım & Bakım Rehberi</a>
        <a href="https://www.trendyol.com/magaza/senin-magaza-id" class="nav-link">🛍️ Tüm Ürünlerimizi İncele</a>
        <a href="https://instagram.com/seninmarkan" class="nav-link">📸 Instagram'da Bizi Takip Et</a>
        <a href="https://wa.me/905XXXXXXXXX" class="nav-link" style="background: #25d366; color: white; border: none;">💬 WhatsApp Canlı Destek</a>

        <div class="footer">
            &copy; 2026 Bambu Smart Home <br> Mutfağınıza Değer Katar.
        </div>
    </div>
</body>
</html>
